name: bcer-recon
channels:
  - conda-forge
dependencies:
  - python=3.10
  - pip
  - numpy<2
  - scipy
  - h5py
  - nibabel
  # pygrappa imports tqdm and scikit-image at module load; reconstruct_grappa
  # prefers SimpleITK for writing (the nibabel fallback loses voxel spacing).
  - scikit-image
  - simpleitk
  - tqdm
  - pyyaml
  - jsonschema
  # Required to *dispatch* a tool into this tier, not by reconstruct_grappa itself:
  # building the shell tool registry imports agent.loop -> react_failure_reflector ->
  # mri_agent_shell.runtime.patch_spec, which is a pydantic model. Without it the tier
  # can only be used by importing tools/reconstruct_grappa.py directly.
  - pydantic>=2
  - pip:
      - pygrappa
