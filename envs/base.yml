name: bcer-base
channels:
  - conda-forge
dependencies:
  - python=3.10
  - pip
  - numpy<2
  - pydicom
  - simpleitk
  - pillow
  - nibabel>=5.1
  - scipy>=1.10
  - pyyaml
  - jsonschema
  # compare_nifti_slices and generate_qa_snapshot both use matplotlib (Agg).
  - matplotlib-base
  - pip:
      - openai>=1.0
      - anthropic>=0.25
      - google-generativeai>=0.5
      - bm3d
      # Optional: LangGraph planner backend. agent/langgraph/loop.py imports it
      # behind a guarded try/except and falls back to the built-in loop when it
      # is absent. Install it with:  pip install -r requirements-langgraph.txt
      # - langgraph>=0.2
